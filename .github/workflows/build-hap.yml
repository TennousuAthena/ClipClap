name: Build unsigned HAP

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned HAP
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "6.1"

      - name: Configure build environment
        run: |
          echo "DEVECO_SDK_HOME=${OHOS_BASE_SDK_HOME}" >> "${GITHUB_ENV}"
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          npm config set registry https://registry.npmjs.org/

      - name: Install Hvigor
        run: |
          npm install --no-save --no-package-lock @ohos/hvigor@6.22.7 @ohos/hvigor-ohos-plugin@6.22.7

      - name: Print tool versions
        run: |
          node --version
          node node_modules/@ohos/hvigor/bin/hvigor.js --version --accept-license
          echo "OHOS_BASE_SDK_HOME=${OHOS_BASE_SDK_HOME}"
          echo "DEVECO_SDK_HOME=${DEVECO_SDK_HOME}"

      - name: Disable signing for CI
        run: node .github/scripts/prepare-unsigned-build-profile.mjs

      - name: Build unsigned HAP
        run: |
          node node_modules/@ohos/hvigor/bin/hvigor.js clean --no-parallel --no-daemon
          node node_modules/@ohos/hvigor/bin/hvigor.js assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug --stacktrace --no-parallel --no-daemon

      - name: Collect unsigned HAP
        run: |
          mkdir -p artifacts
          cp entry/build/default/outputs/default/entry-default-unsigned.hap artifacts/ClipClap-entry-default-unsigned.hap
          ls -lh artifacts

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: ClipClap-unsigned-hap
          path: artifacts/ClipClap-entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 14
